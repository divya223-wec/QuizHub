<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub - Online Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>QuizHub</h1>
        <p>Learn, Practice and Test Your Knowledge</p>
    </header>

    <main class="container">

        <section id="home">
            <h2>Choose Your Subject</h2>
            <p>Select a subject to start your quiz.</p>

            <div class="subjects">
                <button class="subject-btn" data-subject="AI">
                    Artificial Intelligence
                </button>

                <button class="subject-btn" data-subject="Cloud Computing">
                    Cloud Computing
                </button>

                <button class="subject-btn" data-subject="Parallel and Distributed Systems">
                    Parallel and Distributed Systems
                </button>

                <button class="subject-btn" data-subject="Data Science Essentials">
                    Data Science Essentials
                </button>

                <button class="subject-btn" data-subject="ML">
                    Machine Learning
                </button>
            </div>
        </section>

        <section id="quiz" hidden>
            <h2 id="subject-title"></h2>
            <p id="progress"></p>

            <h3 id="question"></h3>
            <div id="answers"></div>

            <p id="feedback" aria-live="polite"></p>

            <button id="next-btn" disabled>Next Question</button>
        </section>

        <section id="result" hidden>
            <h2>Quiz Completed!</h2>
            <p id="score"></p>
            <p id="percentage"></p>

            <button id="home-btn">Back to Home</button>
        </section>

        <section id="history">
            <h2>Previous Quiz Results</h2>
            <div id="history-list"></div>
        </section>

    </main>

    <footer>
        <p>© 2026 QuizHub | Online Learning Platform</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
